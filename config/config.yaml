# Configuration for Real-Time Hand Gesture Recognition & Game Control System

system:
  app_name: "Gesture Game Controller"
  version: "1.0.0"
  random_seed: 42

camera:
  device_id: 0
  frame_width: 640
  frame_height: 480
  fps: 30

mediapipe:
  max_num_hands: 1
  min_detection_confidence: 0.7
  min_tracking_confidence: 0.7

inference:
  confidence_threshold: 0.65
  smoothing_window: 1
  control_stability_frames: 1

gestures:
  classes:
    - ACCELERATE
    - BRAKE
    - NEUTRAL
    

controls:
  key_mapping:
    ACCELERATE: "right"
    BRAKE: "left"
    NEUTRAL: null

paths:
  raw_data: "data/raw/gestures.csv"
  processed_data: "data/processed/processed_features.csv"
  telemetry_dir: "data/telemetry"
  telemetry_file: "data/telemetry/session_telemetry.csv"
  model_path: "models/best_model.pkl"
  preprocessor_path: "models/preprocessor.pkl"
  metadata_path: "models/model_metadata.json"
  reports_dir: "reports"
  comparison_report: "reports/model_comparison.csv"
  classification_report: "reports/classification_report.txt"
  resume_metrics: "reports/resume_metrics.txt"

data_collection:
  target_samples_per_gesture: 1000
  delay_between_frames_ms: 30
